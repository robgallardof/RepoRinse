[package]
name = "reporinse"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Keep the code. Rinse the noise. Local, deterministic cleanup and guardrails for Git and coding agents."
license = "MIT"
repository = "https://github.com/robgallardof/RepoRinse"
readme = "README.md"
keywords = ["git", "hooks", "cli", "lint", "agents"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "reporinse"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = "3.2.1"
toml = "1.1.8"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
