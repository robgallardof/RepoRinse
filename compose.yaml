# One-shot reporinse runs against a repository mounted at /repo.
#   docker compose run --rm reporinse check --staged
#   docker compose run --rm reporinse fix --message .git/COMMIT_EDITMSG
services:
  reporinse:
    build: .
    image: reporinse:local
    user: ${REPORINSE_USER:-10001:10001}
    volumes:
      - type: bind
        source: ${REPORINSE_REPO:-.}
        target: /repo
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
