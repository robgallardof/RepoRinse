<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="406" viewBox="0 0 1200 406" role="img" aria-label="Local only: No AI calls, no network, no telemetry at runtime. A rule engine, not an AI detector. · Deterministic: Same input, same output. Fixes are idempotent. · Safe by default: check never writes. Fixes keep encoding, BOM and line endings. · Respectful: Existing hooks keep running. Uninstall restores the original bytes. · Keeps humans: Drops AI Co-Authored-By lines and keeps human co-authors." data-readme-component="bento"><title>Local only: No AI calls, no network, no telemetry at runtime. A rule engine, not an AI detector. · Deterministic: Same input, same output. Fixes are idempotent. · Safe by default: check never writes. Fixes keep encoding, BOM and line endings. · Respectful: Existing hooks keep running. Uninstall restores the original bytes. · Keeps humans: Drops AI Co-Authored-By lines and keeps human co-authors.</title><defs><linearGradient id="kb" x2="1" y2="0"><stop stop-color="#7c3aed"/><stop offset=".55" stop-color="#4f46e5"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient><linearGradient id="kbd" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset=".55" stop-color="#4f46e5"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs><style>text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Inter,Arial,sans-serif}.orb{animation:orb 10s ease-in-out infinite}@keyframes orb{0%,100%{opacity:.08}50%{opacity:.22}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.75" y="0.75" width="793.833" height="194.5" rx="20" fill="#10162a" stroke="#253150" stroke-width="1.5"/><circle class="orb" style="animation-delay:0s" cx="731.333" cy="48" r="26" fill="url(#kbd)" opacity=".12"/><rect x="24" y="24" width="40" height="40" rx="12" fill="url(#kbd)" opacity=".15"/><g transform="translate(33 33) scale(0.916667)" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="12" rx="3"/><path d="M8 10V6a4 4 0 0 1 8 0v4m-4 5v3"/></g><text x="78" y="49" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="start" letter-spacing="1.8">OFFLINE</text><text x="24" y="100" font-size="23" font-weight="700" fill="#e8edf7" text-anchor="start">Local only</text><text x="24" y="130" font-size="17" font-weight="400" fill="#9aa7bf" text-anchor="start">No AI calls, no network, no telemetry at runtime. A rule engine, not an AI detector.</text><rect x="810.083" y="0.75" width="389.167" height="194.5" rx="20" fill="#10162a" stroke="#253150" stroke-width="1.5"/><rect x="833.333" y="24" width="40" height="40" rx="12" fill="url(#kbd)" opacity=".15"/><g transform="translate(842.333 33) scale(0.916667)" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></g><text x="887.333" y="49" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="start" letter-spacing="1.8">OUTPUT</text><text x="833.333" y="100" font-size="23" font-weight="700" fill="#e8edf7" text-anchor="start">Deterministic</text><text x="833.333" y="130" font-size="17" font-weight="400" fill="#9aa7bf" text-anchor="start">Same input, same output. Fixes are</text><text x="833.333" y="152" font-size="17" font-weight="400" fill="#9aa7bf" text-anchor="start">idempotent.</text><rect x="0.75" y="210.75" width="389.167" height="194.5" rx="20" fill="#10162a" stroke="#253150" stroke-width="1.5"/><rect x="24" y="234" width="40" height="40" rx="12" fill="url(#kbd)" opacity=".15"/><g transform="translate(33 243) scale(0.916667)" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 12 3 3 5-6"/></g><text x="78" y="259" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="start" letter-spacing="1.8">WRITES</text><text x="24" y="310" font-size="23" font-weight="700" fill="#e8edf7" text-anchor="start">Safe by default</text><text x="24" y="340" font-size="17" font-weight="400" fill="#9aa7bf" text-anchor="start">check never writes. Fixes keep encoding,</text><text x="24" y="362" font-size="17" font-weight="400" fill="#9aa7bf" text-anchor="start">BOM and line endings.</text><rect x="405.417" y="210.75" width="389.167" height="194.5" rx="20" fill="#10162a" stroke="#253150" stroke-width="1.5"/><rect x="428.667" y="234" width="40" height="40" rx="12" fill="url(#kbd)" opacity=".15"/><g transform="translate(437.667 243) scale(0.916667)" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-4-4m4 4-4 4M19 17H5l4 4m-4-4 4-4"/></g><text x="482.667" y="259" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="start" letter-spacing="1.8">HOOKS</text><text x="428.667" y="310" font-size="23" font-weight="700" fill="#e8edf7" text-anchor="start">Respectful</text><text x="428.667" y="340" font-size="17" font-weight="400" fill="#9aa7bf" text-anchor="start">Existing hooks keep running. Uninstall</text><text x="428.667" y="362" font-size="17" font-weight="400" fill="#9aa7bf" text-anchor="start">restores the original bytes.</text><rect x="810.083" y="210.75" width="389.167" height="194.5" rx="20" fill="#10162a" stroke="#253150" stroke-width="1.5"/><rect x="833.333" y="234" width="40" height="40" rx="12" fill="url(#kbd)" opacity=".15"/><g transform="translate(842.333 243) scale(0.916667)" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3m1-17a4 4 0 0 1 0 8m3 9v-3a5 5 0 0 0-2-4"/></g><text x="887.333" y="259" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="start" letter-spacing="1.8">COMMITS</text><text x="833.333" y="310" font-size="23" font-weight="700" fill="#e8edf7" text-anchor="start">Keeps humans</text><text x="833.333" y="340" font-size="17" font-weight="400" fill="#9aa7bf" text-anchor="start">Drops AI Co-Authored-By lines and keeps</text><text x="833.333" y="362" font-size="17" font-weight="400" fill="#9aa7bf" text-anchor="start">human co-authors.</text></svg>
